; PlatformIO config for XIAO ESP32-S3 Deutschlandfunk Radio
;
; CLI cheatsheet:
;   pio run                              Build (real hardware)
;   pio run -t upload                    Build & flash via USB
;   pio device monitor                   Serial monitor (115200 baud)
;   pio run -t upload && pio device monitor   Flash + monitor
;
; Wokwi simulation:
;   pio run -e wokwi                     Build for simulator
;   Then open wokwi.json in browser or VS Code extension
;
; First time setup:
;   brew install platformio              Install PlatformIO CLI
;   pio run                              Downloads board support + libs automatically

; ── Real hardware build ──────────────────────────────────────────────
[env:xiaoesp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<main.cpp>
lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12

; ── Test tone (speaker/amp test, no Wi-Fi) ──────────────────────────
;   pio run -e test -t upload && pio device monitor
[env:test]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<test_tone.cpp>

; ── Direct speaker test (no amplifier, GPIO square wave) ────────────
;   pio run -e test-direct -t upload --upload-port /dev/cu.usbmodem1101
[env:test-direct]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<test_speaker_direct.cpp>

; ── Wokwi simulation build (no audio/wifi libs needed) ───────────────
[env:wokwi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<main_wokwi.cpp>
